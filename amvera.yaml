meta:
  name: vb-skaner
  toolchain:
    name: node
    version: 20

build:
  # Устанавливаем все зависимости и собираем фронтенд через Vite
  command: npm install && npm run build

run:
  # Запускаем Express сервер, который раздает статику и обрабатывает API
  command: npm run start
  persistence:
    /data: data
